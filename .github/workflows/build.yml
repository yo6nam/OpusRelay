name: Build OpusRelay

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-linux-amd64:
    name: Build Linux amd64
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: '1.21'
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libopus-dev gcc pkg-config
    - name: Build
      run: |
        GOOS=linux GOARCH=amd64 CGO_ENABLED=1 \
        go build -ldflags="-s -w" -o webproxy-linux-amd64 webproxy.go
    - uses: actions/upload-artifact@v4
      with:
        name: webproxy-linux-amd64
        path: webproxy-linux-amd64

  build-linux-armhf:
    name: Build Linux armhf
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: '1.21'
    - name: Configure Ubuntu Ports for armhf & Install dependencies
      run: |
        if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
          sudo sed -i 's/^Types: deb/Architectures: amd64 i386\nTypes: deb/' /etc/apt/sources.list.d/ubuntu.sources
        fi
        echo "deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports noble main restricted universe multiverse" | sudo tee /etc/apt/sources.list.d/armhf.list
        echo "deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports noble-updates main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list.d/armhf.list
        echo "deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports noble-security main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list.d/armhf.list

        sudo dpkg --add-architecture armhf
        sudo apt-get update
        sudo apt-get install -y \
          gcc-arm-linux-gnueabihf \
          libc6-dev-armhf-cross \
          libopus-dev:armhf
    - name: Build
      run: |
        export CC=arm-linux-gnueabihf-gcc
        export PKG_CONFIG_PATH=/usr/lib/arm-linux-gnueabihf/pkgconfig
        GOOS=linux GOARCH=arm GOARM=7 CGO_ENABLED=1 \
        go build -ldflags="-s -w" -o webproxy-linux-armhf webproxy.go
    - uses: actions/upload-artifact@v4
      with:
        name: webproxy-linux-armhf
        path: webproxy-linux-armhf

  build-windows:
    name: Build Windows amd64
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: '1.21'
    - name: Install dependencies and Opus from Xiph Official Mirror
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-mingw-w64-x86-64 make
        cd /tmp
        # Descarcare de pe oglinda oficiala Xiph/Downloads unde tarball-urile sunt permanente
        wget https://downloads.xiph.org/releases/opus/opus-1.5.2.tar.gz
        tar -xzf opus-1.5.2.tar.gz
        cd opus-1.5.2
        ./configure --host=x86_64-w64-mingw32 --prefix=/usr/x86_64-w64-mingw32
        make -j$(nproc)
        sudo make install
    - name: Build
      run: |
        export CC=x86_64-w64-mingw32-gcc
        export CXX=x86_64-w64-mingw32-g++
        export PKG_CONFIG_PATH=/usr/x86_64-w64-mingw32/lib/pkgconfig
        GOOS=windows GOARCH=amd64 CGO_ENABLED=1 \
        go build -ldflags="-s -w" -o webproxy-windows-amd64.exe webproxy.go
    - uses: actions/upload-artifact@v4
      with:
        name: webproxy-windows-amd64
        path: webproxy-windows-amd64.exe

release:
    name: Create GitHub Release
    needs: [build-linux-amd64, build-linux-armhf, build-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4

    - name: Display downloaded files
      run: ls -R

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          webproxy-linux-amd64/webproxy-linux-amd64
          webproxy-linux-armhf/webproxy-linux-armhf
          webproxy-windows-amd64/webproxy-windows-amd64.exe
        draft: false
        prerelease: false
        generate_release_notes: true
