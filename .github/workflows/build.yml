name: Build OpusRelay

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag for Release (ex: v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  build-linux-amd64:
    name: Build Linux amd64
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: '1.21'
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libopus-dev gcc pkg-config
    - name: Build
      run: |
        GOOS=linux GOARCH=amd64 CGO_ENABLED=1 \
        go build -ldflags="-s -w" -o webproxy-linux-amd64 webproxy.go
    - uses: actions/upload-artifact@v4
      with:
        name: webproxy-linux-amd64
        path: webproxy-linux-amd64

  build-linux-armhf:
    name: Build Linux armhf
    runs-on: ubuntu-latest
    container:
      image: debian:bullseye
    steps:
    - name: Install Base Tools & Add Architecture
      run: |
        apt-get update
        apt-get install -y git wget gcc-arm-linux-gnueabihf libc6-dev-armhf-cross pkg-config
        dpkg --add-architecture armhf
        apt-get update
        apt-get install -y libopus-dev:armhf

    - uses: actions/checkout@v4

    - name: Install Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    - name: Build
      run: |
        export CC=arm-linux-gnueabihf-gcc
        export PKG_CONFIG_PATH=/usr/lib/arm-linux-gnueabihf/pkgconfig
        GOOS=linux GOARCH=arm GOARM=7 CGO_ENABLED=1 \
        go build -ldflags="-s -w" -o webproxy-linux-armhf webproxy.go

    - uses: actions/upload-artifact@v4
      with:
        name: webproxy-linux-armhf
        path: webproxy-linux-armhf

  build-windows:
    name: Build Windows amd64
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: '1.21'
    - name: Install dependencies and build static Opus for Windows
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-mingw-w64-x86-64 make
        cd /tmp
        wget https://downloads.xiph.org/releases/opus/opus-1.5.2.tar.gz
        tar -xzf opus-1.5.2.tar.gz
        cd opus-1.5.2
        ./configure --host=x86_64-w64-mingw32 --prefix=/usr/x86_64-w64-mingw32 --enable-static --disable-shared
        make -j$(nproc)
        sudo make install
    - name: Build
      run: |
        export CC=x86_64-w64-mingw32-gcc
        export CXX=x86_64-w64-mingw32-g++
        export PKG_CONFIG_PATH=/usr/x86_64-w64-mingw32/lib/pkgconfig
        GOOS=windows GOARCH=amd64 CGO_ENABLED=1 \
        go build -ldflags="-s -w -extldflags '-static'" -o webproxy-windows-amd64.exe webproxy.go
    - uses: actions/upload-artifact@v4
      with:
        name: webproxy-windows-amd64
        path: webproxy-windows-amd64.exe

  release:
    name: Create GitHub Release
    needs: [build-linux-amd64, build-linux-armhf, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4

    - name: Display downloaded files
      run: ls -R

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ inputs.tag_name }}
        files: |
          webproxy-linux-amd64/webproxy-linux-amd64
          webproxy-linux-armhf/webproxy-linux-armhf
          webproxy-windows-amd64/webproxy-windows-amd64.exe
        draft: false
        prerelease: false
        generate_release_notes: true
