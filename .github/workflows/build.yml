name: Build OpusRelay

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-linux-amd64:
    name: Build Linux amd64
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-go@v5
      with:
        go-version: '1.21'
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libopus-dev gcc
    
    - name: Build
      run: |
        GOOS=linux GOARCH=amd64 CGO_ENABLED=1 \
        go build -ldflags="-s -w" -o webproxy-linux-amd64 webproxy.go
    
    - uses: actions/upload-artifact@v4
      with:
        name: webproxy-linux-amd64
        path: webproxy-linux-amd64

  build-linux-armhf:
    name: Build Linux armhf
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-go@v5
      with:
        go-version: '1.21'
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libopus-dev gcc-arm-linux-gnueabihf
    
    - name: Build
      run: |
        CC=arm-linux-gnueabihf-gcc \
        GOOS=linux GOARCH=arm GOARM=7 CGO_ENABLED=1 \
        go build -ldflags="-s -w" -o webproxy-linux-armhf webproxy.go
    
    - uses: actions/upload-artifact@v4
      with:
        name: webproxy-linux-armhf
        path: webproxy-linux-armhf

  build-windows:
    name: Build Windows amd64
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-go@v5
      with:
        go-version: '1.21'
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-mingw-w64-x86-64 libopus-dev
    
    - name: Build
      run: |
        CC=x86_64-w64-mingw32-gcc \
        GOOS=windows GOARCH=amd64 CGO_ENABLED=1 \
        go build -ldflags="-s -w" -o webproxy-windows-amd64.exe webproxy.go
    
    - uses: actions/upload-artifact@v4
      with:
        name: webproxy-windows-amd64
        path: webproxy-windows-amd64.exe
