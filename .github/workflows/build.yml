# Varianta care compilează ARM într-un container separat
jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, armhf]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: '1.21'
    
    - name: Build for ${{ matrix.arch }}
      run: |
        if [ "${{ matrix.arch }}" = "amd64" ]; then
          sudo apt-get update && sudo apt-get install -y libopus-dev gcc
          GOOS=linux GOARCH=amd64 CGO_ENABLED=1 go build -ldflags="-s -w" -o webproxy-linux-amd64 webproxy.go
        else
          # Pentru ARM, folosim un container cu arhitectura corectă
          docker run --rm -v $PWD:/build -w /build \
            arm32v7/ubuntu:22.04 \
            bash -c "
              apt-get update && apt-get install -y golang-go libopus-dev gcc &&
              GOOS=linux GOARCH=arm GOARM=7 CGO_ENABLED=1 \
              go build -ldflags='-s -w' -o webproxy-linux-armhf webproxy.go
            "
        fi
    
    - uses: actions/upload-artifact@v4
      with:
        name: webproxy-linux-${{ matrix.arch }}
        path: webproxy-linux-${{ matrix.arch }}

  build-windows:
    name: Build Windows
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: '1.21'
    
    - name: Build for Windows
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-mingw-w64-x86-64 libopus-dev
        CC=x86_64-w64-mingw32-gcc GOOS=windows GOARCH=amd64 CGO_ENABLED=1 \
        go build -ldflags="-s -w" -o webproxy-windows-amd64.exe webproxy.go
    
    - uses: actions/upload-artifact@v4
      with:
        name: webproxy-windows-amd64
        path: webproxy-windows-amd64.exe
