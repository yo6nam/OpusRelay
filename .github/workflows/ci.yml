name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          check-latest: true

      # opus.go uses cgo (#cgo LDFLAGS: -lopus) to bind against libopus.
      - name: Install libopus (cgo dependency)
        run: |
          sudo apt-get update
          sudo apt-get install -y libopus-dev

      - name: gofmt check
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt'd:"
            echo "$fmt_out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Build
        run: go build -v ./...

      - name: Test (with race detector)
        run: go test -race ./...

      - name: staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          version: latest
          install-go: false

      - name: gosec
        uses: securego/gosec@master
        with:
          args: "-exclude-generated ./..."

      - name: govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: "1.21"
          check-latest: true
